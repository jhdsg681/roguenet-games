<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RogueNet</title>
<style>
:root{color-scheme:dark;--bg:#10252a;--win:#20242a;--panel:#2a2e36;--card:#2b3038;--line:#3d4452;--text:#e7e9ed;--muted:#98a0ac;--accent:#d9962b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#060b16 url(wallpapers/milky-way-peaks.webp) center/cover no-repeat;color:var(--text);font:13px/1.4 Tahoma,Verdana,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#icons{position:fixed;top:10px;left:10px;bottom:50px;display:flex;flex-flow:column wrap;gap:6px;align-content:flex-start}
.ic{width:78px;padding:6px 2px;border:1px dotted transparent;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:#e8eef0;font-size:12px;text-shadow:1px 1px 0 #000}
.ic svg{width:32px;height:32px;color:var(--accent)}
.ic:hover,.ic:focus-visible{background:rgba(31,78,95,.65);border-color:#9cc3d1}
svg.i{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:square}
#desk{position:fixed;inset:0 0 40px 0;pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;background:var(--win);border:2px solid;border-color:#5a6275 #14171c #14171c #5a6275;pointer-events:auto;contain:layout paint;min-width:280px;min-height:200px}
.win.top{border-color:#7a859b #14171c #14171c #7a859b}
.win.max{inset:0!important;width:auto!important;height:auto!important}
.win.min{display:none}
.tb{display:flex;align-items:center;gap:3px;height:26px;padding:0 3px 0 8px;background:#2c3038;cursor:grab;user-select:none;touch-action:none;flex:none}
.win.top .tb{background:linear-gradient(90deg,#1f4e5f,#2f7384)}
.tb b{flex:1;font-size:12px;color:#9aa1ad;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win.top .tb b{color:#f2f6f8}
.wb{width:20px;height:17px;padding:0;border:2px solid;border-color:#7a859b #14171c #14171c #7a859b;background:#2f343d;font-size:12px;line-height:1}
.wb:active{border-color:#14171c #7a859b #7a859b #14171c}
.wbody{flex:1;min-height:0;overflow:hidden;position:relative}
.bar{position:fixed;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:3px;padding:4px 4px 4px 4px;background:#1b1f26;border-top:2px solid #4a5262;z-index:9999;overflow-x:auto}
.start{flex:none;padding:4px 12px;font-weight:700;color:#17110a;background:var(--accent);border:2px solid;border-color:#f1c981 #5e4210 #5e4210 #f1c981}
.dk{flex:none;height:30px;padding:0 10px;display:flex;align-items:center;gap:6px;font-size:12px;background:#2a2f38;border:2px solid;border-color:#5a6275 #12151a #12151a #5a6275}
.dk svg{width:16px;height:16px;color:var(--accent)}
.dk.run{background:#1d2128;border-color:#12151a #5a6275 #5a6275 #12151a}
#clock{margin-left:auto;padding:0 10px;white-space:nowrap}
.btn{padding:6px 12px;border:2px solid;border-color:#7a859b #14171c #14171c #7a859b;background:#2f343d}
.btn:active{border-color:#14171c #7a859b #7a859b #14171c}
.btn.main{background:var(--accent);color:#17110a;border-color:#f1c981 #5e4210 #5e4210 #f1c981}
input[type=search],select,.field{padding:6px 9px;border:2px solid;border-color:#14171c #5a6275 #5a6275 #14171c;background:#14171c}
/* games */
.gl{display:grid;grid-template-columns:170px minmax(0,1fr);height:100%}
.nav{overflow:auto;padding:8px;background:#1a1d23;display:flex;flex-direction:column;gap:1px;min-height:0}
.nav button{display:flex;justify-content:space-between;padding:6px 9px;border:0;background:none;color:var(--muted);text-align:left;text-transform:lowercase}
.nav button:hover{background:#1e2128;color:var(--text)}
.nav button[aria-pressed=true]{background:#1f4e5f;color:#fff}
.nav i{height:1px;background:var(--line);margin:5px 3px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.sb{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.sb input{flex:1;min-width:0}
.cnt{color:var(--muted);white-space:nowrap}
.scroll{flex:1;min-height:0;overflow:auto;padding:10px;overscroll-behavior:contain}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px}
.card{position:relative;background:var(--card);border:1px solid var(--line);cursor:pointer;content-visibility:auto;contain-intrinsic-size:128px 150px}
.card:hover,.card:focus-visible{border-color:var(--accent)}
.thumb{aspect-ratio:4/3;position:relative;display:grid;place-items:center;overflow:hidden}
.thumb svg{width:46%;height:auto}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6px;background:inherit}
.thumb img.cv{object-fit:cover;padding:0}
.meta{padding:6px 8px 8px;text-transform:lowercase}
.meta b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta small{color:var(--muted);font-size:11px}
.star{position:absolute;top:4px;right:4px;z-index:1;width:26px;height:26px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px}
.star.on{color:#ffc94d}
.empty,.more{grid-column:1/-1;color:var(--muted);text-align:center;padding:30px 0}
/* game viewer */
.gv{display:flex;flex-direction:column;height:100%}
.gt{display:flex;gap:6px;align-items:center;padding:5px 8px;background:#1a1d23;flex:none;flex-wrap:wrap}
.gt .btn{padding:3px 9px}
.gt span{color:var(--muted);margin-left:auto}
.gv iframe{flex:1;width:100%;border:0;background:#000;min-height:0}
.gmsg{position:absolute;inset:34px 0 0 0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);background:var(--win)}
/* small apps */
.pad{padding:14px;overflow:auto;height:100%}
.pad h3{margin:0 0 8px;font-size:12px;color:var(--muted);font-weight:500}
.pad section{margin-bottom:18px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:84px;height:50px;border:2px solid transparent;background-size:cover}
.sw.ac button{width:28px;height:28px;border-radius:50%}
.sw button[aria-pressed=true]{border-color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.calc{display:flex;flex-direction:column;height:100%;padding:10px;gap:8px}
.cd{background:#14171c;padding:8px 12px;text-align:right;min-height:74px;display:flex;flex-direction:column;justify-content:flex-end;font-family:'Courier New',monospace}
.cd small{color:var(--muted);min-height:16px}.cd output{font-size:34px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ck button{border:2px solid;border-color:#6a7488 #14171c #14171c #6a7488;background:#2d323b;font-size:17px}
.ck .o{background:#3a3f4b}.ck .f{background:#1f232b;color:var(--muted)}.ck .e{background:var(--accent);color:#17110a}
.code{display:flex;flex-direction:column;height:100%}
.ct{display:flex;gap:8px;padding:6px 8px;background:#1a1d23;flex:none}
.code textarea,.np{flex:1;width:100%;resize:none;border:0;padding:10px;background:#101216;color:#d7dae0;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;outline:none;white-space:pre;tab-size:2}
.cout{height:36%;min-height:80px;overflow:auto;border-top:1px solid var(--line);background:#0c0e12;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
.cout pre{margin:0;padding:8px 10px;white-space:pre-wrap}.cout iframe{width:100%;height:100%;border:0;background:#fff}.err{color:#ff7b72}
@media(max-width:800px){
.win{inset:0!important;width:auto!important;height:auto!important}
.tb{cursor:default}
.gl{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
.nav{flex-direction:row;overflow-x:auto;padding:6px}
.nav button{white-space:nowrap;gap:6px;border:1px solid var(--line)}.nav i{display:none}
.dk span{display:none}.dk{padding:0 8px}
.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const ICON_CANDS=['icon.png','icon-512.png','icon-192.png','icon-256.png','img/icon.png','images/icon.png','assets/icon.png','assets/images/icon.png','favicon.png','logo.png','img/logo.png','images/logo.png','thumbnail.png','thumb.png','cover.png','icon.jpg','logo.jpg','favicon.ico'];
let FOUND=null;const FQ=[];let FACT=0;
function fpump(){while(FACT<6&&FQ.length){FACT++;FQ.shift()(()=>{FACT--;fpump()})}}
function fixIcons(root){
  if(FOUND===null)FOUND=store.get('rn2-found',{});
  root.querySelectorAll('.thumb[data-fi]').forEach(th=>{
    const g=G[+th.dataset.fi];th.removeAttribute('data-fi');const base=NET[g.u]&&NET[g.u][0];if(!base)return;
    const c=FOUND[g.u];if(c===0)return;
    FQ.push(done=>{
      const add=im=>{im.alt='';im.className='fi';th.appendChild(im)};
      if(c){const im=new Image();im.referrerPolicy='no-referrer';im.onload=()=>{add(im);done()};im.onerror=()=>{delete FOUND[g.u];done()};im.src=c;return}
      let k=0;
      const next=()=>{
        if(k>=ICON_CANDS.length){FOUND[g.u]=0;store.set('rn2-found',FOUND);done();return}
        const url=base+ICON_CANDS[k++];const im=new Image();im.referrerPolicy='no-referrer';
        im.onload=()=>{if(im.naturalWidth>=32){FOUND[g.u]=url;store.set('rn2-found',FOUND);add(im);done()}else next()};
        im.onerror=next;im.src=url;
      };
      next();
    });
  });
  fpump();
}
async function netProbe(url){const c=new AbortController();const t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(url,{method:'HEAD',cache:'no-store',signal:c.signal});clearTimeout(t);return r.ok?'ok':(r.status===404||r.status===410?'dead':'odd')}catch(e){clearTimeout(t);return 'unreach'}}
async function runDoctor(say){
  const net=G.filter(g=>NET[g.u]&&NET[g.u][1]&&!hidden.has(g.u));
  const res={ok:0,dead:0,odd:0,unreach:0},dead=[];let i=0,fin=0;
  const wk=async()=>{while(i<net.length){const g=net[i++];const r=await netProbe(NET[g.u][1]);res[r]++;if(r==='dead')dead.push(g.u);if(++fin%25===0)say('Checking outside hosts... '+fin+'/'+net.length)}};
  await Promise.all(Array.from({length:8},wk));
  const loc={total:0,dead:[]};
  if(location.protocol!=='file:'){
    const L=G.filter(g=>!/^(pk:|bk:|https?:)/.test(g.u)&&!hidden.has(g.u));loc.total=L.length;let j=0,f2=0;
    const wk2=async()=>{while(j<L.length){const g=L[j++];try{const r=await fetch(g.u,{method:'HEAD',cache:'no-store'});if(!r.ok)loc.dead.push(g.u)}catch(e){}if(++f2%100===0)say('Checking files on this site... '+f2+'/'+L.length)}};
    await Promise.all(Array.from({length:8},wk2));
  }
  return{res,dead,total:net.length,local:loc};
}

const desk=$('#desk'),wins={};let z=10,off=0;
function openWin(id,title,w,h,build){
  if(wins[id]){show(wins[id]);return wins[id]}
  const el=document.createElement('section');el.className='win';
  const dw=desk.clientWidth,dh=desk.clientHeight;w=Math.min(w,dw-12);h=Math.min(h,dh-12);
  const o=(off++%6)*24;
  el.style.cssText=`width:${w}px;height:${h}px;left:${Math.max(6,(dw-w)/2+o-50)}px;top:${Math.max(6,(dh-h)/2+o-40)}px`;
  el.innerHTML='<div class="tb"><b></b><button class="wb" data-a="min" aria-label="Minimize">_</button><button class="wb" data-a="max" aria-label="Maximize">\u25a1</button><button class="wb" data-a="close" aria-label="Close">\u00d7</button></div><div class="wbody"></div>';
  const W={id,el,body:$('.wbody',el),title:$('b',el)};W.title.textContent=title;
  desk.appendChild(el);wins[id]=W;
  el.addEventListener('pointerdown',()=>show(W));
  el.addEventListener('click',e=>{const b=e.target.closest('.wb');if(!b)return;const a=b.dataset.a;
    if(a==='close')closeWin(W);else if(a==='min'){el.classList.add('min');bar()}else el.classList.toggle('max')});
  const tb=$('.tb',el);
  tb.addEventListener('dblclick',e=>{if(!e.target.closest('.wb'))el.classList.toggle('max')});
  tb.addEventListener('pointerdown',e=>{
    if(e.target.closest('.wb')||el.classList.contains('max')||innerWidth<=800)return;
    const sx=e.clientX-el.offsetLeft,sy=e.clientY-el.offsetTop;let raf=0,nx=0,ny=0;
    tb.setPointerCapture(e.pointerId);
    const mv=ev=>{nx=ev.clientX-sx;ny=ev.clientY-sy;if(!raf)raf=requestAnimationFrame(()=>{raf=0;el.style.left=Math.min(Math.max(nx,-el.offsetWidth+80),desk.clientWidth-60)+'px';el.style.top=Math.min(Math.max(ny,0),desk.clientHeight-30)+'px'})};
    const up=()=>{tb.removeEventListener('pointermove',mv);tb.removeEventListener('pointerup',up)};
    tb.addEventListener('pointermove',mv);tb.addEventListener('pointerup',up);
  });
  build(W);show(W);return W;
}

function playGame(g){
  if(!g)return;
  const W=openWin('game',g.nm,980,640,W=>{
    W.body.innerHTML='<div class="gv"><div class="gt"><button class="btn" data-a="reload">Reload</button><button class="btn" data-a="full">Fullscreen</button><button class="btn" data-a="tab">New tab</button><button class="btn" data-a="fav"></button><button class="btn" data-a="bad">Not working</button><span></span></div><iframe title="game" allow="fullscreen; autoplay; gamepad; clipboard-write" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-forms allow-modals allow-downloads allow-orientation-lock allow-presentation"></iframe></div>';
    const fr=$('iframe',W.body),st=$('.gt span',W.body);let cur=null,msg=null;
    const say=t=>{if(msg)msg.remove();msg=null;if(t){msg=document.createElement('div');msg.className='gmsg';msg.textContent=t;W.body.appendChild(msg)}};
    const favLab=()=>$('[data-a=fav]',W.body).textContent=favs.has(cur.u)?'\u2605 Favorited':'\u2606 Favorite';
    W.load=function(g2){
      cur=g2;W.title.textContent=g2.nm;say('');st.textContent='loading\u2026';fr.src='about:blank';favLab();
      const local=!/^https?:/.test(g2.u);
      const go=()=>{fr.src=g2.u;st.textContent=''};
      if(local&&location.protocol!=='file:'){
        fetch(g2.u,{method:'HEAD'}).then(r=>{if(!r.ok)throw 0;go()}).catch(()=>{st.textContent='';say("This game's files are missing from the site. Make sure the games folder was copied into a folder called play (see README.txt).")});
      }else go();
    };
    W.body.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a||!cur)return;
      switch(a.dataset.a){
        case'reload':W.load(cur);break;
        case'full':(fr.requestFullscreen||fr.webkitRequestFullscreen||(()=>{})).call(fr);break;
        case'tab':window.open(cur.u,'_blank','noopener');break;
        case'fav':favs.has(cur.u)?favs.delete(cur.u):favs.add(cur.u);saveFav();favLab();if(wins.games)wins.games.redraw();break;
        case'bad':hidden.add(cur.u);saveHid();fr.src='about:blank';say('Hidden. You can bring hidden games back in Settings.');if(wins.games)wins.games.redraw();break;
      }});
    W.onclose=()=>{fr.src='about:blank'};
  });
  W.load(g);
}

/* ---------- settings ---------- */
function openSettings(){openWin('settings','Settings',440,430,W=>{
  let docMsg='',lastDead=[];
  const draw=()=>{W.body.innerHTML=`<div class="pad"><section><h3>Wallpaper</h3><div class="sw">${WALL.map((w,i)=>`<button data-w="${i}" aria-pressed="${S.w===i}" aria-label="${w[0]}" title="${w[0]}" style="background:${w[1]}"></button>`).join('')}</div></section><section><h3>Accent color</h3><div class="sw ac">${ACC.map(a=>`<button data-a="${a[1]}" aria-pressed="${S.a===a[1]}" aria-label="${a[0]}" title="${a[0]}" style="background:${a[1]}"></button>`).join('')}</div></section><section class="row"><span>24-hour clock</span><input type="checkbox" data-h ${S.h24?'checked':''}></section><section class="row"><span>Hidden games: ${hidden.size}</span><button class="btn" data-unhide>Bring back</button></section><section class="row"><span>Favorites: ${favs.size}</span><button class="btn" data-clear>Clear</button></section><section><h3>Game doctor</h3><div class="row"><span>Test the games that load from outside sites and hide the dead ones</span><button class="btn" data-doc>Check games</button></div><div id="docout" style="color:var(--muted);margin-top:8px;font-size:12px">${docMsg}</div></section><section><h3>Game saves</h3><div class="row"><span>Back up or restore every save on this browser</span><span><button class="btn" data-exp>Export</button> <button class="btn" data-imp>Import</button></span></div><p style="color:var(--muted);margin:8px 0 0;font-size:12px">Saves stay on this browser for this site address, even after you close the tab. Clearing site data or using a private window deletes them, so export a backup now and then.</p></section></div>`};
  draw();
  const doctorGo=async()=>{
    const sayTo=m=>{const o=W.body.querySelector('#docout');if(o)o.textContent=m};sayTo('Starting...');
    const r=await runDoctor(sayTo);const all=r.dead.concat(r.local.dead);lastDead=all;
    docMsg='Checked '+r.total+' games that load from outside sites: '+r.res.ok+' answered, '+r.res.dead+' are gone, '+r.res.unreach+' could not be reached (blocked network, offline, or the host does not allow checks).'+(r.local.total?' Files on this site checked: '+r.local.total+', missing: '+r.local.dead.length+'.':'')+(all.length?'<br><button class="btn" data-hidedead style="margin-top:6px">Hide '+all.length+' dead games</button>':'');
    draw();
  };
  W.body.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
    if(t.hasAttribute('data-doc')){doctorGo();return}
    if(t.hasAttribute('data-hidedead')){lastDead.forEach(u=>hidden.add(u));saveHid();lastDead=[];docMsg='Hid the dead games.';if(wins.games)wins.games.redraw();draw();return}
    if(t.dataset.w!==undefined)S.w=+t.dataset.w;else if(t.dataset.a)S.a=t.dataset.a;
    else if(t.hasAttribute('data-unhide')){hidden.clear();saveHid();if(wins.games)wins.games.redraw()}
    else if(t.hasAttribute('data-clear')){favs.clear();saveFav();if(wins.games)wins.games.redraw()}
    else if(t.hasAttribute('data-exp')){exportSaves();return}
    else if(t.hasAttribute('data-imp')){importSaves();return}
    else return;applyS();draw()});
  W.body.addEventListener('change',e=>{const t=e.target;if(t.hasAttribute('data-h'))S.h24=t.checked;else return;applyS()});
})}

/* ---------- calculator ---------- */
function openCalc(){openWin('calc','Calculator',300,420,W=>{
  W.body.innerHTML='<div class="calc"><div class="cd"><small></small><output>0</output></div><div class="ck"></div></div>';
  const K=['AC','\u00b1','%','\u00f7','7','8','9','\u00d7','4','5','6','\u2212','1','2','3','+','0','.','\u232b','='];
  const ck=$('.ck',W.body),out=$('output',W.body),h=$('small',W.body);
  ck.innerHTML=K.map(k=>`<button data-k="${k}" class="${['AC','\u00b1','%','\u232b'].includes(k)?'f':['\u00f7','\u00d7','\u2212','+'].includes(k)?'o':k==='='?'e':''}">${k}</button>`).join('');
  let cur='0',acc=null,op=null,fresh=true;
  const fmt=n=>String(parseFloat(n.toPrecision(12)));
  const ev=(a,b,o)=>o==='+'?a+b:o==='\u2212'?a-b:o==='\u00d7'?a*b:a/b;
  function press(k){
    if(cur==='Error'&&k!=='AC')return;
    if(/^[0-9]$/.test(k)){cur=fresh||cur==='0'?k:cur+k;fresh=false}
    else if(k==='.'){if(fresh){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
    else if(k==='AC'){cur='0';acc=null;op=null;fresh=true;h.textContent=''}
    else if(k==='\u232b'){cur=!fresh&&cur.length>1?cur.slice(0,-1):'0';if(cur==='-')cur='0'}
    else if(k==='\u00b1'){if(cur!=='0')cur=cur[0]==='-'?cur.slice(1):'-'+cur}
    else if(k==='%'){cur=fmt(parseFloat(cur)/100);fresh=true}
    else{const v=parseFloat(cur);if(op&&!fresh)acc=ev(acc,v,op);else if(!op)acc=v;
      if(!isFinite(acc)){cur='Error';acc=null;op=null;fresh=true;h.textContent='';out.textContent=cur;return}
      cur=fmt(acc);if(k==='='){h.textContent='';op=null}else{op=k;h.textContent=cur+' '+k}fresh=true}
    out.textContent=cur;
  }
  ck.addEventListener('click',e=>{const x=e.target.closest('button');if(x)press(x.dataset.k)});
  const map={'/':'\u00f7','*':'\u00d7','-':'\u2212','+':'+','Enter':'=','=':'=','Backspace':'\u232b','Escape':'AC','%':'%','.':'.'};
  W.el.tabIndex=-1;W.el.addEventListener('keydown',e=>{const k=/^[0-9]$/.test(e.key)?e.key:map[e.key];if(k){e.preventDefault();press(k)}});
})}

/* ---------- code runner ---------- */
const BOOT='<scr'+'ipt>'+"const s=t=>parent.postMessage({rn:1,t:t},'*');const f=a=>a.map(x=>{try{return typeof x==='object'?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(' ');['log','info','warn','error'].forEach(k=>{console[k]=(...a)=>s((k==='log'||k==='info'?'':k+': ')+f(a))});window.onerror=m=>s('error: '+m);"+'</scr'+'ipt><scr'+'ipt>';
const SAMPLE={js:"// Press Ctrl+Enter to run\nconst fib=n=>n<2?n:fib(n-1)+fib(n-2);\nfor(let i=0;i<10;i++)console.log('fib('+i+') =',fib(i));\n",html:"<h1 style='font-family:sans-serif'>Hello, RogueNet</h1>\n<button onclick=\"this.textContent='Clicked'\">Click me</button>\n"};
function openCode(){openWin('code','Code',680,500,W=>{
  W.body.innerHTML='<div class="code"><div class="ct"><select aria-label="Language"><option value="js">JavaScript</option><option value="html">HTML</option></select><button class="btn main" data-r>Run</button><button class="btn" data-c>Clear</button></div><textarea spellcheck="false" aria-label="Code"></textarea><div class="cout"></div></div>';
  const ta=$('textarea',W.body),out=$('.cout',W.body),lang=$('select',W.body);let fr=null;
  ta.value=SAMPLE.js;
  lang.onchange=()=>{ta.value=SAMPLE[lang.value];out.innerHTML='';fr=null};
  const onMsg=e=>{if(!fr||e.source!==fr.contentWindow||!e.data||!e.data.rn)return;const p=$('pre',out);if(p){const d=document.createElement('div');d.textContent=e.data.t;if(/^error/.test(e.data.t))d.className='err';p.appendChild(d)}};
  addEventListener('message',onMsg);W.onclose=()=>removeEventListener('message',onMsg);
  const run=()=>{out.innerHTML='';fr=document.createElement('iframe');fr.setAttribute('sandbox','allow-scripts');fr.title='Output';
    if(lang.value==='html')fr.srcdoc=ta.value;
    else{out.innerHTML='<pre></pre>';fr.style.display='none';fr.srcdoc=BOOT+ta.value.split('</scr').join('<\\/scr')+'</scr'+'ipt>'}
    out.appendChild(fr)};
  $('[data-r]',W.body).onclick=run;$('[data-c]',W.body).onclick=()=>{out.innerHTML='';fr=null};
  ta.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();ta.setRangeText('  ',ta.selectionStart,ta.selectionEnd,'end')}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run()}});
})}

/* ---------- notes ---------- */
function openNotes(){openWin('notes','readme.txt',420,320,W=>{
  W.body.innerHTML='<textarea class="np" spellcheck="false" aria-label="Notes"></textarea>';
  const ta=$('textarea',W.body);ta.value=store.get('rn2-notes','todo\n- pick a wallpaper\n- star the good games\n');
  ta.oninput=()=>store.set('rn2-notes',ta.value);
})}

/* ---------- desktop, taskbar, clock ---------- */
const barEl=$('#bar'),clock=$('#clock');
APPS.forEach(([id,name])=>{
  const b=document.createElement('button');b.className='dk';b.dataset.app=id;b.innerHTML=ICON[id]+'<span>'+name+'</span>';b.title=name;b.onclick=()=>toggleApp(id);barEl.insertBefore(b,clock);
  const i=document.createElement('button');i.className='ic';i.innerHTML=ICON[id]+'<span>'+name+'</span>';
  const coarse=matchMedia('(pointer:coarse)').matches;
  i.ondblclick=()=>openApp(id);i.onclick=()=>{if(coarse)openApp(id)};i.onkeydown=e=>{if(e.key==='Enter')openApp(id)};
  $('#icons').appendChild(i);
});
function tick(){clock.textContent=new Date().toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit',hour12:!S.h24})}
setInterval(()=>{if(!document.hidden)tick()},30000);
function exportSaves(){try{const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);o[k]=localStorage.getItem(k)}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download='roguenet-saves-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove()}catch(e){alert('Could not export saves.')}}
function importSaves(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);let n=0;for(const k in o){if(typeof o[k]==='string'){localStorage.setItem(k,o[k]);n++}}alert('Restored '+n+' items. Reload the page to see them.')}catch(e){alert('That file is not a RogueNet save backup.')}})};i.click()}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
applyS();openGames();
</script>
